openapi: 3.0.3
info:
  title: Shortlink API
  description: High-performance URL shortener REST API reference implementation in Go.
  version: 1.0.0
servers:
  - url: https://shortlink-production-1c53.up.railway.app
    description: Production server (Railway)
  - url: http://localhost:8080
    description: Local development server

paths:
  /healthz:
    get:
      summary: Liveness probe
      description: Returns 200 OK as long as the process is alive.
      responses:
        '200':
          description: Process is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /readyz:
    get:
      summary: Readiness probe
      description: Returns 200 only if the server is ready and the database is reachable.
      responses:
        '200':
          description: Database is reachable and server is ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ready
        '503':
          description: Database is down or server is shutting down
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/auth/register:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  minLength: 8
                  example: secret1234
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  email:
                    type: string
                  created_at:
                    type: string
                    format: date-time
        '409':
          description: Email already in use
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Invalid email format or short password
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/auth/login:
    post:
      summary: Authenticate user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Access token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                    example: Bearer
        '401':
          description: Invalid credentials
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/links:
    post:
      summary: Create shortlink
      security:
        - BearerAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          schema:
            type: string
          required: false
          description: Optional idempotency key to prevent duplicate creation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  maxLength: 2048
                  example: https://go.dev/doc/effective_go
                custom_code:
                  type: string
                  minLength: 4
                  maxLength: 32
                  example: my-docs
                expires_at:
                  type: string
                  format: date-time
                  nullable: true
      responses:
        '201':
          description: Link created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Link'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Custom code already in use
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Invalid URL, custom code, or idempotency conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    get:
      summary: List user links
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: cursor
          schema:
            type: string
          description: Opaque keyset pagination cursor
      responses:
        '200':
          description: List of links
          content:
            application/json:
              schema:
                type: object
                properties:
                  links:
                    type: array
                    items:
                      $ref: '#/components/schemas/Link'
                  next_cursor:
                    type: string
        '400':
          description: Invalid cursor or param
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/links/{code}:
    get:
      summary: Get owned link details
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: code
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Link details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Link'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Link not found or not owned
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      summary: Delete owned link
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: code
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Link successfully deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Link not found or not owned
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/links/{code}/stats:
    get:
      summary: Get link click statistics
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: code
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Click statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_clicks:
                    type: integer
                    example: 42
                  clicks_per_day:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          format: date
                          example: "2026-11-04"
                        clicks:
                          type: integer
                          example: 10
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Link not found or not owned
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /{code}:
    get:
      summary: Redirect to target URL
      parameters:
        - in: path
          name: code
          required: true
          schema:
            type: string
      responses:
        '302':
          description: Temporary redirect to target long URL
          headers:
            Location:
              schema:
                type: string
                example: https://go.dev/doc/effective_go
        '404':
          description: Unknown code
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '410':
          description: Expired link
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthorized:
      description: Missing or invalid authentication token
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Problem:
      type: object
      required: [type, title, status, code, detail]
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
          example: Bad Request
        status:
          type: integer
          example: 400
        code:
          type: string
          example: invalid_param
        detail:
          type: string
          example: specific human-readable explanation
        request_id:
          type: string
          example: 9a382b68-e435-48ef-bfeb-db127d1a21e4

    Link:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          example: abc1234
        short_url:
          type: string
          example: http://localhost:8080/abc1234
        target_url:
          type: string
          example: https://go.dev/doc/effective_go
        expires_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
