services:
  postgres:
    image: postgres:17-alpine
    container_name: shortlink-postgres
    environment:
      POSTGRES_USER: shortlink
      POSTGRES_PASSWORD: shortlink
      POSTGRES_DB: shortlink
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortlink"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shortlink-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      HTTP_ADDR: ":8080"
      BASE_URL: "http://localhost:8080"
      DATABASE_URL: "postgres://shortlink:shortlink@postgres:5432/shortlink?sslmode=disable"
      JWT_SECRET: "this-is-a-production-secret-at-least-32-bytes"
      LOG_LEVEL: "info"
      LOG_FORMAT: "json"
    ports:
      - "8080:8080"

  swagger:
    image: swaggerapi/swagger-ui
    container_name: shortlink-swagger
    environment:
      SWAGGER_JSON: /api/openapi.yaml
    volumes:
      - ./api:/api:ro
    ports:
      - "8081:8080"

volumes:
  postgres_data:
